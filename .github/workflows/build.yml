# Every push to main builds Windows (.exe) and Mac (.dmg) and publishes them as a new release.
# Installed apps check these releases and update themselves.
name: Build Endora Invoice
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/test.js
      # One release for both builds, made first so the Windows and Mac jobs do not race to create it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v1.0.${{ github.run_number }}" --title "Endora Invoice 1.0.${{ github.run_number }}" --notes "${{ github.event.head_commit.message }}" --target "${{ github.sha }}"
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Version 1.0.<run number>
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - name: Build and publish
        run: npx electron-builder --publish always
