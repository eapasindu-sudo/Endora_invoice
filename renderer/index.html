<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Endora Invoice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lock" class="lock hidden">
  <div class="lockbox"><img src="logo.png" alt=""><h2>Endora Invoice</h2><p>Enter your PIN</p>
    <input id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><div id="pinErr" class="err"></div></div>
</div>
<aside class="side">
  <div class="brand"><img src="logo.png" alt=""><div><div class="nm">ENDORA</div><div class="sub">INVOICE</div></div></div>
  <nav id="nav">
    <a data-v="dash" class="on">Dashboard</a>
    <a data-v="bookings">Bookings</a>
    <a data-v="invoices">Invoices</a>
    <a data-v="packages">Packages</a>
    <a data-v="settings">Settings</a>
  </nav>
  <div id="upd" class="upd hidden"></div>
  <div class="ver" id="ver"></div>
</aside>
<main id="main"></main>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
